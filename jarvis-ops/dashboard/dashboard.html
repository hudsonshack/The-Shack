<style>
/* Layout: a console. Status strip, then four thread cards, then what needs you (alerts + tasks), then one panel per domain, then the logs. */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --fg: #12202a;
  --muted: #5a6b76;
  --line: #d6dee4;
  --accent: #0b7285;
  --accent-soft: #d3eef2;
  --ok: #2b8a3e;
  --warn: #b35c00;
  --crit: #c22b2b;
  --ok-soft: #dcf2e1;
  --warn-soft: #fbe9d4;
  --crit-soft: #f8dcdc;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1116; --surface: #111b22; --fg: #dbe6ec; --muted: #8798a4; --line: #22323c;
    --accent: #4fc3d9; --accent-soft: #123842;
    --ok: #69db7c; --warn: #ffb35c; --crit: #ff8a8a;
    --ok-soft: #173622; --warn-soft: #3a2814; --crit-soft: #3d1a1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1116; --surface: #111b22; --fg: #dbe6ec; --muted: #8798a4; --line: #22323c;
  --accent: #4fc3d9; --accent-soft: #123842;
  --ok: #69db7c; --warn: #ffb35c; --crit: #ff8a8a;
  --ok-soft: #173622; --warn-soft: #3a2814; --crit-soft: #3d1a1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--font-body);
  padding-inline: 16px; padding-block: 20px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
h1, h2 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 26px; letter-spacing: 0.04em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.mono, td.num, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }

/* Status strip */
.strip { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px;
  border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.strip .meta { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; }
.strip .meta b { font-family: var(--font-data); font-weight: 600; color: var(--fg); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }

/* Threads */
.threads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .threads { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .threads { grid-template-columns: minmax(0, 1fr); } }
.thread { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; align-content: start; }
.thread header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.thread .name { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.thread .domain { font-size: 12px; color: var(--muted); }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; font-size: 12px; color: var(--muted); }
.counts b { display: block; font-family: var(--font-data); font-size: 20px; color: var(--fg); font-weight: 600; }
.share { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.thread .summary { font-size: 13px; color: var(--muted); margin: 0; }

.pill { display: inline-block; font: 600 11px/1 var(--font-data); text-transform: uppercase; letter-spacing: 0.06em;
  padding: 4px 7px; border-radius: 999px; background: var(--line); color: var(--muted); white-space: nowrap; }
.pill.idle, .pill.done, .pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.running, .pill.execute { background: var(--ok-soft); color: var(--ok); }
.pill.warn, .pill.verify, .pill.plan { background: var(--warn-soft); color: var(--warn); }
.pill.error, .pill.blocked, .pill.critical { background: var(--crit-soft); color: var(--crit); }
.pill.human { background: transparent; border: 1px solid var(--muted); color: var(--fg); }

/* Needs you */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 24px; }
@media (max-width: 800px) { .split { grid-template-columns: minmax(0, 1fr); } }
.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alerts li { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--radius); }
.alerts li.warn { border-left-color: var(--warn); }
.alerts li.critical { border-left-color: var(--crit); }
.alerts .src { grid-column: 2; font-size: 12px; color: var(--muted); }

.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font: 600 11px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.num { white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.task { min-width: 200px; }
.empty { padding: 14px; color: var(--muted); font-size: 13.5px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); margin: 0; }

/* Domain panels */
.domains { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 800px) { .domains { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h3 { margin: 0; font: 600 16px/1.2 var(--font-display); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.panel h4 { margin: 0; font: 600 11px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.kv div { font-size: 12px; color: var(--muted); }
.kv b { display: block; font: 600 18px/1.3 var(--font-data); color: var(--fg); font-variant-numeric: tabular-nums; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.rows li { display: flex; justify-content: space-between; gap: 12px; }
.rows li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.rows li span:last-child { font-family: var(--font-data); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.goal { display: grid; gap: 4px; font-size: 13px; }
.goal .top { display: flex; justify-content: space-between; gap: 8px; }
.goal .top span:last-child { font-family: var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.feed { font-size: 12px; }

.logs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 800px) { .logs { grid-template-columns: minmax(0, 1fr); } }
footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
</style>

<div class="wrap">
  <div class="strip">
    <div>

</div>

document.getElementById("runs").innerHTML = data.runs.length ? `<div class="scroll"><table>
  <thead><tr><th>Cycle</th><th>Started</th><th>Result</th><th>Tasks</th></tr></thead>
  <tbody>${data.runs.map(r => `<tr><td>${esc(r.cycle)}</td><td class="num">${when(r.started)}</td><td>${pill(r.result === "ok" ? "running" : r.result === "partial" ? "warn" : "error", r.result)}</td><td class="num">${esc(r.tasks_run)}</td></tr>`).join("")}</tbody></table></div>`
  : empty(`No cycles have run yet. The first one is ${nc ? esc(nc.name) + " at " + when(nc.at) : "scheduled"}.`);
document.getElementById("commits").innerHTML = data.commits.length ? `<div class="scroll"><table>
  <thead><tr><th>SHA</th><th>When</th><th>Subject</th></tr></thead>
  <tbody>${data.commits.map(c => `<tr><td class="num">${esc(c.sha)}</td><td class="num" style="white-space:nowrap">${when(c.at)}</td><td>${esc(c.subject)}</td></tr>`).join("")}</tbody></table></div>`
  : empty("No commits found.");

document.getElementById("foot").innerHTML = `Cycles: ${data.cycles.map(c => esc(c.name) + " " + esc(c.local_time)).join(" · ")} (${esc(data.timezone)}). Rendered from jarvis-ops state by render_dashboard.py.`;
</script>
